[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stats-transformer"
version = "1.6.0"
description = "A comprehensive Python library for robust macroeconomic data transformation, analysis, and visualization."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name="Cory Baird", email="open.empirical.macro@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "linearmodels>=7.0",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pyarrow>=19.0.0",
    "pyreadstat>=1.3.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "xarray>=2026.7.0",
]

[project.optional-dependencies]
benchmarks = [
    "rpy2>=3.6.7",
]
notebooks = [
    "jupyter>=1.1.1",
]
all = [
    "stats-transformer[benchmarks,notebooks]",
]

[project.urls]
Homepage = "https://github.com/corybaird/stats-transformer"
Repository = "https://github.com/corybaird/stats-transformer"
Changelog = "https://github.com/corybaird/stats-transformer/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Narrow, blocking ruleset: real correctness bugs only (undefined names,
# undefined __all__ entries, syntax errors) -- exactly the class of bug
# that let SignRestrictionsSVARModel (a name that didn't exist) reach
# runtime undetected. Broader style rules are deliberately not enabled
# here; the repo has ~250 pre-existing violations under ruff's default
# ruleset that would need a dedicated cleanup pass first.
select = ["F821", "F822", "E9"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Narrow include list, expanded as files gain annotations. See
# docs/extensions/roadmap.md for the annotation plan.
files = [
    "src/stats_transformer/utils/config.py",
    "src/stats_transformer/models/base.py",
    "src/stats_transformer/pipeline.py",
    "src/stats_transformer/models/regression/regression.py",
    "src/stats_transformer/models/unsupervised/unsupervised.py",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/.agents",
  "/data",
  "/docs",
  "/notebooks",
  "/references",
  "/tests",
  "/reports",
  "/models",
]

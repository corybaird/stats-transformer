# Single source of truth for model validation status.
# One entry per row of the paper's Table 1 (model inventory). Every row in
# docs/validation/benchmarks.md section 2.1 (Verified Models) is generated from
# the `verified` entries by scripts/generate_model_status.py; the LaTeX rows of
# the paper's Table 1 are generated from all entries.
#
# Statuses:
#   verified      a wrapper test in tests/test_external_parity/ passes against a
#                 recorded external-software output at the stated tolerance
#   known_issue   a strict xfail records a documented library bug (or a planned fix)
#   python_tested implemented and covered by Python tests; no external parity yet
#   unresolved    comparison attempted without evidence of numerical agreement
#
# Fields:
#   family       Table 1 family group
#   models       Python classes on this row
#   benchmark    dataset shown in benchmarks.md (name, optional path and extra
#                text) and in Table 1 (optional `tex` override)
#   targets      reference software: `software`, `func`, optional `note`
#   status       one of the four statuses above; `none` renders as `---`
#   tolerance    discrepancy text (may contain $...$ math and `code` spans)
#   tests        pytest node ids backing a `verified` or `known_issue` status
#   note         one-line known-issue note
#
# After editing, run: uv run python scripts/generate_model_status.py
# Tests in tests/test_docs/test_model_status_docs.py fail if checked-in
# documentation or test ids drift from this file.

- family: Regression
  models:
    - {name: RegressionModel, tex: 'Regression\-Model'}
  benchmark: {name: Longley, path: data/examples/regression/longley.csv}
  targets:
    - {software: Stata, func: regress}
    - {software: R, func: stats::lm}
    - {software: MATLAB, func: mldivide}
    - {software: Python, func: statsmodels}
  status: verified
  tolerance: $10^{-7}$
  tests: [tests/test_external_parity/test_wrapper_parity.py::test_ols_longley_matches_r_stata_matlab]

- family: Regression

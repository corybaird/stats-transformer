services:
  r-integration:
    build:
      context: .
      dockerfile: tests/integration/Dockerfile
    volumes:
      - .:/app
    environment:
      - R_AVAILABLE=1
    command: >
      bash -c "uv sync && uv run python -m pytest tests/integration/ -v"

  r-benchmarks:
    build:
      context: .
      dockerfile: tests/integration/Dockerfile
    volumes:
      - .:/app
    environment:
      - R_AVAILABLE=1
    command: >
      bash -c "uv sync && uv add rpy2 && uv run python -m src.examples.software_benchmarks.benchmark_suite"
